<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Rohan Nath</title>
  <meta name="description" content="Portfolio of Rohan Nath, MS, specializing in bioinformatics and GPCRs.">
  <meta name="keywords" content="Rohan Nath, bioinformatics, GPCRs, pharmacogenomics, evolutionary biology">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Reset and Base Styles */
    :root {
      --bg-dark: #282a36;
      --bg-light: #f5f5f5;
      --text-dark: #f8f8f2;
      --text-light: #333;
      --accent-dark: #50fa7b;
      --accent-light: #2e7d32;
      --secondary-dark: #6272a4;
      --secondary-light: #90a4ae;
      --bg-gradient-dark: linear-gradient(rgba(40, 42, 54, 0.95), rgba(40, 42, 54, 0.95));
      --bg-gradient-light: linear-gradient(rgba(245, 245, 245, 0.95), rgba(245, 245, 245, 0.95));
      --header-bg-dark: rgba(29, 31, 42, 0.9);
      --header-bg-light: rgba(255, 255, 255, 0.9);
      --footer-bg-dark: #1d1f2a;
      --footer-bg-light: #e0e0e0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
    }

    body {
      background: var(--bg-gradient-dark),
                  url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><defs><filter id="blur"><feGaussianBlur in="SourceGraphic" stdDeviation="2"/></filter></defs><g opacity="0.3"><path d="M200,200 Q400,100 600,200 T1000,200 Q1200,100 1400,200 T1800,200" stroke="#50fa7b" stroke-width="2" fill="none" opacity="0.4" filter="url(#blur)"/><path d="M200,300 Q400,400 600,300 T1000,300 Q1200,400 1400,300 T1800,300" stroke="#50fa7b" stroke-width="2" fill="none" opacity="0.4" filter="url(#blur)"/><circle cx="300" cy="500" r="5" fill="#6272a4"/><circle cx="350" cy="520" r="4" fill="#6272a4"/><circle cx="400" cy="480" r="5" fill="#6272a4"/><circle cx="1200" cy="600" r="5" fill="#6272a4"/><circle cx="1250" cy="620" r="4" fill="#6272a4"/><circle cx="1300" cy="580" r="5" fill="#6272a4"/><line x1="500" y1="700" x2="600" y2="750" stroke="#6272a4" stroke-width="1" opacity="0.5"/><line x1="600" y1="750" x2="700" y2="700" stroke="#6272a4" stroke-width="1" opacity="0.5"/><line x1="1400" y1="400" x2="1500" y2="450" stroke="#6272a4" stroke-width="1" opacity="0.5"/><line x1="1500" y1="450" x2="1600" y2="400" stroke="#6272a4" stroke-width="1" opacity="0.5"/></g></svg>') center/cover no-repeat fixed;
      color: var(--text-dark);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    body.light-mode {
      background: var(--bg-gradient-light),
                  url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><defs><filter id="blur"><feGaussianBlur in="SourceGraphic" stdDeviation="2"/></filter></defs><g opacity="0.3"><path d="M200,200 Q400,100 600,200 T1000,200 Q1200,100 1400,200 T1800,200" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0.4" filter="url(#blur)"/><path d="M200,300 Q400,400 600,300 T1000,300 Q1200,400 1400,300 T1800,300" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0.4" filter="url(#blur)"/><circle cx="300" cy="500" r="5" fill="#90a4ae"/><circle cx="350" cy="520" r="4" fill="#90a4ae"/><circle cx="400" cy="480" r="5" fill="#90a4ae"/><circle cx="1200" cy="600" r="5" fill="#90a4ae"/><circle cx="1250" cy="620" r="4" fill="#90a4ae"/><circle cx="1300" cy="580" r="5" fill="#90a4ae"/><line x1="500" y1="700" x2="600" y2="750" stroke="#90a4ae" stroke-width="1" opacity="0.5"/><line x1="600" y1="750" x2="700" y2="700" stroke="#90a4ae" stroke-width="1" opacity="0.5"/><line x1="1400" y1="400" x2="1500" y2="450" stroke="#90a4ae" stroke-width="1" opacity="0.5"/><line x1="1500" y1="450" x2="1600" y2="400" stroke="#90a4ae" stroke-width="1" opacity="0.5"/></g></svg>') center/cover no-repeat fixed;
      color: var(--text-light);
    }

    /* Header */
    .header {
      background: var(--header-bg-dark);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--secondary-dark);
    }

    body.light-mode .header {
      background: var(--header-bg-light);
      border-bottom: 1px solid var(--secondary-light);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .logo-img {
      height: 64px;
      transition: transform 0.3s ease;
      filter: brightness(0) invert(1);
    }

    body.light-mode .logo-img {
      filter: brightness(0) invert(0);
    }

    .logo-img:hover {
      transform: scale(1.05);
    }

    .nav-menu {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      color: var(--text-dark);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      position: relative;
      transition: color 0.3s ease;
      padding: 0.5rem 0;
    }

    body.light-mode .nav-link {
      color: var(--text-light);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: var(--accent-dark);
      transition: width 0.3s ease;
    }

    body.light-mode .nav-link::after {
      background-color: var(--accent-light);
    }

    .nav-link:hover {
      color: var(--accent-dark);
    }

    body.light-mode .nav-link:hover {
      color: var(--accent-light);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .hamburger-menu {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      z-index: 1001;
    }

    .hamburger-menu span {
      width: 25px;
      height: 3px;
      background-color: var(--text-dark);
      transition: all 0.3s ease;
    }

    body.light-mode .hamburger-menu span {
      background-color: var(--text-light);
    }

    .hamburger-menu.open span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .hamburger-menu.open span:nth-child(2) {
      opacity: 0;
    }

    .hamburger-menu.open span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -7px);
    }

    .social-media {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .social-img {
      width: 28px;
      height: 28px;
      filter: brightness(0) invert(1);
      transition: transform 0.3s ease, filter 0.3s ease, box-shadow 0.3s ease;
    }

    body.light-mode .social-img {
      filter: none;
    }

    .social-icon:hover .social-img {
      transform: scale(1.1);
      box-shadow: 0 0 8px var(--accent-dark);
    }

    body.light-mode .social-icon:hover .social-img {
      box-shadow: 0 0 8px var(--accent-light);
    }

    /* Theme Toggle */
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-icon {
      width: 24px;
      height: 24px;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .theme-icon.sun {
      opacity: 0;
      transform: rotate(-90deg);
      position: absolute;
    }

    body.light-mode .theme-icon.sun {
      opacity: 1;
      transform: rotate(0);
    }

    body.light-mode .theme-icon.moon {
      opacity: 0;
      transform: rotate(90deg);
    }

    /* Main Section */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .network-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.3;
    }

    .welcome-section {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
      max-width: 1000px;
      z-index: 1;
      position: relative;
    }

    .welcome-heading {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      color: var(--text-dark);
      margin-bottom: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: color 0.3s ease;
    }

    body.light-mode .welcome-heading {
      color: var(--text-light);
    }

    .welcome-heading:hover {
      color: var(--accent-dark);
      cursor: default;
    }

    body.light-mode .welcome-heading:hover {
      color: var(--accent-light);
    }

    .welcome-text {
      font-size: 1.3rem;
      color: var(--text-dark);
      font-weight: 400;
      display: block;
    }

    body.light-mode .welcome-text {
      color: var(--text-light);
    }

    .typewriter-text {
      color: var(--accent-dark);
      border-right: 2px solid var(--accent-dark);
      overflow: hidden;
      display: inline-block;
      font-weight: 500;
      font-size: 1.3rem;
      vertical-align: top;
      min-height: 1.3rem;
    }

    body.light-mode .typewriter-text {
      color: var(--accent-light);
      border-right: 2px solid var(--accent-light);
    }

    /* Footer */
    .footer {
      background-color: var(--footer-bg-dark);
      padding: 1rem;
      text-align: center;
      border-top: 1px solid var(--secondary-dark);
      width: 100%;
    }

    body.light-mode .footer {
      background-color: var(--footer-bg-light);
      border-top: 1px solid var(--secondary-light);
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer-text {
      font-size: 0.85rem;
      color: var(--secondary-dark);
      font-weight: 400;
    }

    body.light-mode .footer-text {
      color: var(--secondary-light);
    }

    .footer-links {
      margin-top: 0.5rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .footer-link {
      color: #bd93f9;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    body.light-mode .footer-link {
      color: #0288d1;
    }

    .footer-link:hover {
      color: var(--accent-dark);
    }

    body.light-mode .footer-link:hover {
      color: var(--accent-light);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .nav-menu {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;
        background: var(--footer-bg-dark);
        padding: 1rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      body.light-mode .nav-menu {
        background: var(--footer-bg-light);
      }

      .nav-menu.active {
        display: flex;
      }

      .hamburger-menu {
        display: flex;
      }

      .logo-img {
        height: 48px;
      }

      .welcome-heading {
        font-size: 2.2rem;
      }

      .welcome-text, .typewriter-text {
        font-size: 1rem;
        display: block;
        width: 100%;
        white-space: normal;
        word-wrap: break-word;
      }

      .typewriter-text {
        min-height: 3rem;
      }

      .social-media {
        gap: 0.5rem;
      }

      .social-img {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <header class="header">
    <div class="nav-container">
      <div class="logo">
        <a href="index.html">
          <img src="images/Rohan Nath-.png" alt="Rohan Nath Logo" class="logo-img">
        </a>
      </div>
      <nav class="nav-menu">

  </header>

  <!-- Main Section -->
  <main>
    <canvas class="network-canvas" aria-hidden="true"></canvas>
    <section class="welcome-section">
      <h1 class="welcome-heading">Rohan Nath, MS</h1>
      <p class="welcome-text">Welcome to my portfolio, <span id="animated-text" class="typewriter-text"></span></p>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">

      <div class="footer-links">

        <a href="contact.html" class="footer-link">Contact</a>
      </div>
    </div>

  <script>
    // --- Typewriter Effect ---
    const texts = [
      "where I explore the evolution and pharmacology of G Protein-Coupled Receptors (GPCRs).",
      "where I investigate the lineage-specific expansion of genes.",
      "where I conduct phylogenetic studies.",
      "where I study protein domain and structure.",
      "where I learn new R scripts and explore innovative ways of visualization."
    ];

    let index = 0;
    let charIndex = 0;
    let isDeleting = false;
    const animatedTextElement = document.getElementById('animated-text');

    if (animatedTextElement) {
      const typeSpeedBase = 60;
      const deleteSpeed = 40;
      const pauseAfterTyping = 2000;
      const pauseAfterDeleting = 600;

      const typeWriter = () => {
        const currentText = texts[index];
        animatedTextElement.style.borderRight = '2px solid';

        if (!isDeleting) {
          if (charIndex < currentText.length) {
            animatedTextElement.textContent = currentText.substring(0, charIndex + 1);
            charIndex++;
            setTimeout(typeWriter, typeSpeedBase);
          } else {
            animatedTextElement.style.borderRight = 'none';
            isDeleting = true;
            setTimeout(typeWriter, pauseAfterTyping);
          }
        } else {
          if (charIndex > 0) {
            animatedTextElement.textContent = currentText.substring(0, charIndex - 1);
            charIndex--;
            setTimeout(typeWriter, deleteSpeed);
          } else {
            isDeleting = false;
            index = (index + 1) % texts.length;
            setTimeout(typeWriter, pauseAfterDeleting);
          }
        }
      };

      typeWriter();

      // Cursor animation
      const cursorBlink = () => {
        if (!isDeleting && charIndex === texts[index].length) {
          animatedTextElement.style.borderRight = 'none';
        } else {
          animatedTextElement.style.borderRightColor =
            animatedTextElement.style.borderRightColor === 'transparent' ? '' : 'transparent';
        }
        requestAnimationFrame(cursorBlink);
      };
      requestAnimationFrame(cursorBlink);
    }

    // --- Hamburger Menu ---
    const hamburgerMenu = document.querySelector('.hamburger-menu');
    const navMenu = document.querySelector('.nav-menu');

    if (hamburgerMenu && navMenu) {
      hamburgerMenu.addEventListener('click', () => {
        const isActive = navMenu.classList.toggle('active');
        hamburgerMenu.classList.toggle('open');

        // Animate menu items
        const navLinks = navMenu.querySelectorAll('.nav-link');
        navLinks.forEach((link, i) => {
          link.style.animation = isActive
            ? `slideIn 0.3s ease forwards ${i * 0.1}s`
            : 'none';
        });
      });

      // Close on outside click
      document.addEventListener('click', (e) => {
        if (!hamburgerMenu.contains(e.target) && !navMenu.contains(e.target)) {
          navMenu.classList.remove('active');
          hamburgerMenu.classList.remove('open');
        }
      });

      // Keyboard accessibility
      hamburgerMenu.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          hamburgerMenu.click();
        }
      });
    }

    // --- Theme Toggle ---
    const themeToggle = document.querySelector('.theme-toggle');
    const body = document.body;

    const setTheme = (isLight) => {
      body.classList.toggle('light-mode', isLight);
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    };

    // Load saved theme
    if (localStorage.getItem('theme') === 'light') {
      setTheme(true);
    }

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        setTheme(!body.classList.contains('light-mode'));
      });

      // Keyboard accessibility
      themeToggle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          themeToggle.click();
        }
      });
    }

    // --- Network Animation ---
    const canvas = document.querySelector('.network-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let particles = [];
      const particleCount = 30;

      const resizeCanvas = () => {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      };

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.vx = (Math.random() - 0.5) * 2;
          this.vy = (Math.random() - 0.5) * 2;
          this.radius = Math.random() * 3 + 2;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = body.classList.contains('light-mode') ? '#2e7d32' : '#50fa7b';
          ctx.fill();
        }
      }

      const initParticles = () => {
        particles = [];
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }
      };

      const drawConnections = () => {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = body.classList.contains('light-mode')
                ? `rgba(46, 125, 50, ${1 - distance / 150})`
                : `rgba(80, 250, 123, ${1 - distance / 150})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }
      };

      const animate = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(particle => {
          particle.update();
          particle.draw();
        });
        drawConnections();
        requestAnimationFrame(animate);
      };

      initParticles();
      animate();

      // Reinitialize particles on theme change
      body.addEventListener('transitionend', () => {
        initParticles();
      }, { once: true });
    }
  </script>
